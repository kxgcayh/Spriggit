name: Build

on:
  push:
    branches:
      - dev
      - main
      - prerelease
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    branches:
      - dev
      - main
      - prerelease
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.*
    - name: Install dependencies
      run: |
        dotnet clean Spriggit.slnx -c Release && dotnet nuget locals all --clear
        dotnet restore Spriggit.slnx
    - name: Build
      run: dotnet build Spriggit.slnx -c Release --no-restore /p:GeneratePackageOnBuild=false
    - name: Test
      run: dotnet test Spriggit.slnx -c Release --no-build
    - name: CLI smoke test
      run: dotnet run --project Spriggit.CLI -c Release --no-build -- --help
