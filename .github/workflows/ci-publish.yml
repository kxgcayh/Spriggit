name: Publish

on:
  schedule:
    - cron: '40 9 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional: Release tag to re-publish (e.g. 0.54.0). Moves the tag to current commit and re-uploads. Leave empty for nightly.'
        required: false
        type: string
  release:
    types: [published]

jobs:
  activity-short-circuit:
    if: github.repository == 'Mutagen-Modding/Spriggit'
    runs-on: ubuntu-latest
    outputs:
      same_sha: ${{ steps.check.outputs.same_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get Activity Short Circuit
        id: check
        run: |
          echo "Event name: ${{ github.event_name }}"
          git branch -a
          git fetch origin nightly:nightly
          head_sha=$(git rev-parse --verify HEAD)
          nightly_sha=$(git rev-parse --verify nightly)
          if [[ "$head_sha" == "$nightly_sha" && "${{ github.event_name }}" != "release" && -z "${{ inputs.tag }}" ]]; then
              same_sha=true;
          else
              same_sha=false;
          fi
          echo "head_sha=$head_sha"
          echo "nightly_sha=$nightly_sha"
          echo "same_sha=${same_sha}"
          echo "same_sha=${same_sha}" >> $GITHUB_OUTPUT
        
  build-test:
    needs: activity-short-circuit
    if: needs.activity-short-circuit.outputs.same_sha == 'false'
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3.0.3
      with:
        versionSpec: '6.0.5'
    - name: Determine Version
      id: version_step # step id used as reference for output values
      uses: gittools/actions/gitversion/execute@v3.0.3
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.*
    - name: Install dependencies
      run: |
        dotnet clean Spriggit.slnx -c Release && dotnet nuget locals all --clear
        dotnet restore Spriggit.slnx
    - name: Build
      run: dotnet build Spriggit.slnx -c Release --no-restore
    - name: Test
      run: dotnet test Spriggit.slnx -c Release --no-build
    - name: CLI smoke test
      run: dotnet run --project Spriggit.CLI -c Release --no-build -- --help


  build-test-push:
    needs: [build-test, activity-short-circuit]
    if: needs.activity-short-circuit.outputs.same_sha == 'false'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - name: Get timestamp
      uses: 1466587594/get-current-time@v1
      id: current-time
      with:
        format: YYYYMMDD-HHmmSS
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Update tag to current commit
      if: inputs.tag != ''
      run: |
        git tag -f ${{ env.RELEASE_TAG }}
        git push origin ${{ env.RELEASE_TAG }} --force
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.*
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3.0.3
      with:
        versionSpec: '6.0.5'
    - name: Determine Version
      id: version_step # step id used as reference for output values
      uses: gittools/actions/gitversion/execute@v3.0.3
    - name: Install dependencies
      run: |
        dotnet clean Spriggit.slnx -c Release && dotnet nuget locals all --clear
        dotnet restore Spriggit.slnx
    - name: Build
      run: dotnet build Spriggit.slnx -c Release --no-restore /p:GeneratePackageOnBuild=false
    - name: Pack
      run: |
        dotnet pack Spriggit.slnx -c Release --no-build --no-restore -o out --include-symbols -p:SymbolPackageFormat=snupkg
    - name: Publish standalone CLIs
      if: ${{ success() && !github.event.release.prerelease && env.RELEASE_TAG != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64; do
          dotnet publish Spriggit.CLI/Spriggit.CLI.csproj -c Release -r "$rid" -p:PublishSingleFile=true -p:PackAsTool=false --self-contained true -o "publish/$rid"
          tar -czf "SpriggitCLI-$rid.tar.gz" -C "publish/$rid" .
          gh release upload "$RELEASE_TAG" "SpriggitCLI-$rid.tar.gz" --clobber
        done
    - name: Print Packages
      run: |
        ls out/*.nupkg
    - name: Publish to Nuget.org
      run: |
        for package in out/*.nupkg; do
          dotnet nuget push "$package" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
        done

  update-nightly:
    needs: [build-test-push, activity-short-circuit]
    if: needs.activity-short-circuit.outputs.same_sha == 'false'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Reset nightly to release
      run: |
        head_sha=$(git rev-parse --verify HEAD)
        echo "head_sha=$head_sha"
        git checkout nightly
        git reset --hard $head_sha
        git push